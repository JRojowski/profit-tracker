version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: queries
        out: internal/store/queries
        overrides:
          - column: cash_operations.amount
            go_type: github.com/shopspring/decimal.Decimal
          - column: cash_operations.volume
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: cash_operations.price
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.existing_amount
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.new_amount
            go_type: github.com/shopspring/decimal.Decimal
          - column: import_conflicts.existing_volume
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.existing_price
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.new_volume
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.new_price
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.check_calculated
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: import_conflicts.check_closed_positions
            go_type: github.com/shopspring/decimal.NullDecimal
