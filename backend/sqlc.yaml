version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: queries
        out: internal/store/queries
        overrides:
          - column: cash_operations.amount
            go_type: github.com/shopspring/decimal.Decimal
          - column: cash_operations.volume
            go_type: github.com/shopspring/decimal.NullDecimal
          - column: cash_operations.price
            go_type: github.com/shopspring/decimal.NullDecimal
