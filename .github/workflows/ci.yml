name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Each commit on main gets a full run, because the deployment needs a green CI.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make test

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The action installs golangci-lint only. `make lint` runs it, as on a local machine.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - run: make lint

  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-check

  bicep-lint:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make bicep-lint
